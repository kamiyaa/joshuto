[package]
name = "joshuto"
version = "0.9.9"
authors = ["Jiayi Zhao <jeff.no.zhao@gmail.com>"]
description = "Terminal file manager inspired by ranger"
homepage = "https://github.com/kamiyaa/joshuto"
repository = "https://github.com/kamiyaa/joshuto"
license = "LGPL-3.0"
edition = "2021"
keywords = ["ratatui", "ranger", "file_manager", "termion"]
categories = ['command-line-interface', 'command-line-utilities']
build = "build.rs"

[profile.release]
lto = true
strip = true

[build-dependencies]
shadow-rs = "^2"

[dependencies]
allmytoes = "^0.5"
alphanumeric-sort = "^1"
ansi-to-tui = { version = "^8", optional = true }
bytesize = "^2"
chrono = "^0"
clap = { version = "^4", features = ["derive"] }
clap_complete = "^4"
colors-transform = "^0"
dirs = "^6"
globset = "^0"
image = "^0.25"
lazy_static = "^1"
lscolors = { version = "^0", features = ["nu-ansi-term"] }
nix = { version = "^0", default-features = false, features = ["fs", "signal", "user"] }
notify = "^8"
open = "^5"
phf = { version = "^0", features = ["macros"], optional = true }
rand = "^0"
ratatui = { version = "^0", default-features = false, features = ["termion"] }
ratatui-image = { version = "^11", default-features = false, features = ["termion", "serde"] }
regex = "^1"
rustyline = "^18"
serde = { version = "^1", features = ["derive"] }
shadow-rs = "^2"
shell-words = "^1"
shellexpand = { version = "^3", features = ["full"] }
signal-hook = "^0"
toml = "^1"
unicode-segmentation = "^1"
unicode-width = "^0"
uuid = { version = "^1", features = ["v4", "fast-rng", "macro-diagnostics"] }
walkdir = "^2"
whoami = "^2"

[features]
devicons = ["phf"]
file_mimetype = []
syntax_highlight = ["ansi-to-tui"]
default = ["devicons", "syntax_highlight"]
